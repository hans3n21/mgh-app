services:
  local-mail-ai:
    build: .
    ports:
      - "8765:8765"
    environment:
      # Replace this placeholder with a random key of at least 32 characters.
      MGH_AI_TOKEN: "REPLACE_WITH_RANDOM_ACCESS_KEY"
      MGH_AI_THREADS: "2"
    volumes:
      - model-data:/data
    mem_limit: 2g
    cpus: 2
    # Pilot: inspect failures rather than repeatedly exhausting NAS memory.
    restart: "no"
    security_opt:
      - no-new-privileges:true
volumes:
  model-data:
